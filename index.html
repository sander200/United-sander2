<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
  <title>Sander Unite</title>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      user-select: none;
      -webkit-user-select: none;
    }
    body {
      background: #0d1117;
      color: #fff;
      font-family: 'Segoe UI', Roboto, sans-serif;
      overflow: hidden;
      display: flex;
      justify-content: center;
      align-items: center;
      height: 100vh;
      width: 100vw;
    }
    #game-container {
      position: relative;
      width: 100vw;
      max-width: 960px;
      aspect-ratio: 16 / 9;
      background: #000;
      overflow: hidden;
      border-radius: 12px;
      box-shadow: 0 0 20px rgba(0,0,0,0.8);
    }
    canvas {
      width: 100%;
      height: 100%;
      display: block;
    }
    /* HUD Superior */
    .hud-top {
      position: absolute;
      top: 10px;
      left: 50%;
      transform: translateX(-50%);
      display: flex;
      gap: 15px;
      background: rgba(15, 23, 42, 0.75);
      backdrop-filter: blur(8px);
      padding: 6px 18px;
      border-radius: 20px;
      border: 1px solid rgba(255, 255, 255, 0.15);
      font-weight: bold;
      font-size: 14px;
      z-index: 10;
    }
    .hud-stat {
      display: flex;
      align-items: center;
      gap: 5px;
    }
    /* Controles Virtuales Mobile */
    .d-pad {
      position: absolute;
      bottom: 20px;
      left: 20px;
      width: 120px;
      height: 120px;
      z-index: 10;
    }
    .btn-dir {
      position: absolute;
      width: 38px;
      height: 38px;
      background: rgba(255, 255, 255, 0.2);
      border: 1px solid rgba(255, 255, 255, 0.4);
      border-radius: 50%;
      color: #fff;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 16px;
    }
    .btn-up { top: 0; left: 41px; }
    .btn-down { bottom: 0; left: 41px; }
    .btn-left { top: 41px; left: 0; }
    .btn-right { top: 41px; right: 0; }

    /* Botón Habilidad */
    .btn-action {
      position: absolute;
      bottom: 20px;
      right: 20px;
      width: 80px;
      height: 80px;
      border-radius: 50%;
      background: radial-gradient(circle, #38bdf8 0%, #0284c7 100%);
      border: 3px solid #e0f2fe;
      box-shadow: 0 0 15px rgba(56, 189, 248, 0.6);
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      color: #fff;
      font-size: 11px;
      font-weight: bold;
      z-index: 10;
      cursor: pointer;
    }
    .btn-action:active {
      transform: scale(0.92);
    }
  </style>
</head>
<body>

  <div id="game-container">
    <div class="hud-top">
      <div class="hud-stat">STAGE: <span id="stage-val">1/3</span></div>
      <div class="hud-stat">❤️ <span id="lives-val">2</span></div>
      <div class="hud-stat">⏱️ <span id="time-val">02:00</span></div>
      <div class="hud-stat">⚡ <span id="energy-val">0/1000</span></div>
    </div>

    <canvas id="gameCanvas" width="960" height="540"></canvas>

    <!-- D-Pad -->
    <div class="d-pad">
      <div class="btn-dir btn-up" id="btn-up">▲</div>
      <div class="btn-dir btn-left" id="btn-left">◀</div>
      <div class="btn-dir btn-right" id="btn-right">▶</div>
      <div class="btn-dir btn-down" id="btn-down">▼</div>
    </div>

    <!-- Habilidad -->
    <div class="btn-action" id="btn-freeze">
      <span style="font-size: 24px;">❄️</span>
      CONGELAR
    </div>
  </div>

  <script>
    const canvas = document.getElementById('gameCanvas');
    const ctx = canvas.getContext('2d');

    // Cargar Imágenes
    const bgImg = new Image();
    bgImg.src = 'mapa.jpg';

    const sanderSheet = new Image();
    sanderSheet.src = 'sander.png';

    const nemesisImg = new Image();
    nemesisImg.src = 'nemesis.png';

    // Estado del Jugador (Sander)
    const player = {
      x: 320,
      y: 280,
      width: 70,
      height: 90,
      speed: 4,
      frameX: 0,
      frameY: 0,
      cols: 4,
      rows: 4,
      animTimer: 0,
      isMoving: false,
      isAttacking: false
    };

    // Estado del Jefe / Enemigo (Némesis)
    const boss = {
      x: 580,
      y: 120,
      width: 140,
      height: 200,
      frozen: false,
      freezeTimer: 0
    };

    // Esferas de Energía / Orbes
    const orbs = [
      { x: 380, y: 180, active: true },
      { x: 440, y: 310, active: true },
      { x: 700, y: 150, active: true },
      { x: 720, y: 250, active: true }
    ];

    let energy = 0;
    const keys = {};

    // Entrada Teclado
    window.addEventListener('keydown', e => keys[e.key] = true);
    window.addEventListener('keyup', e => keys[e.key] = false);

    // Controles Táctiles
    const bindTouch = (id, key) => {
      const el = document.getElementById(id);
      el.addEventListener('touchstart', (e) => { e.preventDefault(); keys[key] = true; });
      el.addEventListener('touchend', (e) => { e.preventDefault(); keys[key] = false; });
    };
    bindTouch('btn-up', 'ArrowUp');
    bindTouch('btn-down', 'ArrowDown');
    bindTouch('btn-left', 'ArrowLeft');
    bindTouch('btn-right', 'ArrowRight');

    document.getElementById('btn-freeze').addEventListener('touchstart', triggerFreeze);
    document.getElementById('btn-freeze').addEventListener('click', triggerFreeze);

    function triggerFreeze() {
      if (energy >= 100) {
        boss.frozen = true;
        boss.freezeTimer = 180; // 3 segundos a 60fps
        energy -= 100;
        player.isAttacking = true;
        setTimeout(() => player.isAttacking = false, 400);
      }
    }

    function update() {
      player.isMoving = false;

      if (keys['ArrowUp'] || keys['w']) { player.y -= player.speed; player.isMoving = true; }
      if (keys['ArrowDown'] || keys['s']) { player.y += player.speed; player.isMoving = true; }
      if (keys['ArrowLeft'] || keys['a']) { player.x -= player.speed; player.isMoving = true; }
      if (keys['ArrowRight'] || keys['d']) { player.x += player.speed; player.isMoving = true; }

      // Límites de pantalla
      player.x = Math.max(100, Math.min(canvas.width - 150, player.x));
      player.y = Math.max(120, Math.min(canvas.height - 120, player.y));

      // Animación de Sprite (cuadrícula 4x4)
      player.animTimer++;
      if (player.animTimer % 8 === 0) {
        if (player.isAttacking) {
          player.frameX = 2; // Columna 3
          player.frameY = 2; // Fila 3 (cuadro 11 con auras)
        } else if (player.isMoving) {
          player.frameX = (player.frameX + 1) % player.cols;
          player.frameY = 0; // Fila 1 para caminar
        } else {
          player.frameX = 0;
          player.frameY = 0; // Idle
        }
      }

      // Descongelamiento
      if (boss.frozen) {
        boss.freezeTimer--;
        if (boss.freezeTimer <= 0) boss.frozen = false;
      }

      // Recolección de orbes
      orbs.forEach(orb => {
        if (orb.active) {
          const dist = Math.hypot((player.x + 35) - orb.x, (player.y + 45) - orb.y);
          if (dist < 40) {
            orb.active = false;
            energy = Math.min(1000, energy + 50);
            document.getElementById('energy-val').innerText = `${energy}/1000`;
          }
        }
      });
    }

    function draw() {
      ctx.clearRect(0, 0, canvas.width, canvas.height);

      // 1. Dibujar Mapa de Fondo
      if (bgImg.complete && bgImg.naturalWidth !== 0) {
        ctx.drawImage(bgImg, 0, 0, canvas.width, canvas.height);
      } else {
        ctx.fillStyle = '#1e293b';
        ctx.fillRect(0, 0, canvas.width, canvas.height);
      }

      // 2. Dibujar Orbes de Energía
      orbs.forEach(orb => {
        if (orb.active) {
          ctx.beginPath();
          ctx.arc(orb.x, orb.y, 14, 0, Math.PI * 2);
          ctx.fillStyle = '#fbbf24';
          ctx.shadowColor = '#f59e0b';
          ctx.shadowBlur = 12;
          ctx.fill();
          ctx.shadowBlur = 0;
        }
      });

      // 3. Dibujar Jefe (Némesis)
      if (nemesisImg.complete && nemesisImg.naturalWidth !== 0) {
        if (boss.frozen) {
          ctx.save();
          ctx.filter = 'brightness(1.2) hue-rotate(180deg)';
          ctx.drawImage(nemesisImg, boss.x, boss.y, boss.width, boss.height);
          ctx.restore();
        } else {
          ctx.drawImage(nemesisImg, boss.x, boss.y, boss.width, boss.height);
        }
      }

      // 4. Dibujar Sander con Spritesheet recortada
      if (sanderSheet.complete && sanderSheet.naturalWidth !== 0) {
        const spriteW = sanderSheet.naturalWidth / player.cols;
        const spriteH = sanderSheet.naturalHeight / player.rows;

        ctx.drawImage(
          sanderSheet,
          player.frameX * spriteW, player.frameY * spriteH, spriteW, spriteH, // Origen
          player.x, player.y, player.width, player.height                      // Destino
        );
      } else {
        ctx.fillStyle = '#0284c7';
        ctx.fillRect(player.x, player.y, player.width, player.height);
      }

      // 5. Círculo de congelamiento bajo el jefe
      if (boss.frozen) {
        ctx.beginPath();
        ctx.ellipse(boss.x + boss.width / 2, boss.y + boss.height - 10, 50, 18, 0, 0, Math.PI * 2);
        ctx.strokeStyle = '#38bdf8';
        ctx.lineWidth = 4;
        ctx.stroke();
      }
    }

    function gameLoop() {
      update();
      draw();
      requestAnimationFrame(gameLoop);
    }

    requestAnimationFrame(gameLoop);
  </script>
</body>
</html>
